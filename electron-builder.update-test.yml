appId: app.devkitty.update-test
productName: Devkitty Update Test
copyright: Copyright © 2024 Devkitty

extraMetadata:
  name: devkitty-update-test

mac:
  category: public.app-category.developer-tools
  icon: icons/icon.icon
  hardenedRuntime: true
  target:
    - target: zip
      arch: [arm64]
  entitlements: entitlements.mas.plist
