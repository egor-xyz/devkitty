name: Release

on:
  workflow_dispatch:
    inputs:
      signed_update_test:
        type: boolean
        description: 'Build isolated signed update test artifacts only'
        required: true
        default: false
      bump:
        type: choice
        description: 'Bump version'
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        type: boolean
        description: 'Dry run'
        required: true
        default: false
      draft:
        type: boolean
        description: 'Draft release'
        required: true
        default: false

concurrency:
  group: ${{ github.event.repository.name }}-${{ github.event.inputs.signed_update_test == 'true' && 'signed-update-test' || 'release' }}
  cancel-in-progress: true

jobs:
  release:
    if: github.event.inputs.signed_update_test != 'true' && github.ref != 'refs/heads/test/signed-updater'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Prepare Git
        id: prepare-git
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Enable pnpm
        run: corepack enable pnpm

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          check-latest: true
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bumb version
        id: version
        run: |
          pnpm version ${{ github.event.inputs.bump }}
          echo "new_tag=$(git describe --tags --abbrev=0 | sed 's/v//')" >> $GITHUB_OUTPUT

      - name: Make
        if: github.event.inputs.dry_run != 'true'
        run: |
          chmod +x add-osx-cert.sh && ./add-osx-cert.sh
          pnpm make
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERTIFICATE_OSX_APPLICATION: ${{ secrets.CERTIFICATE_OSX_APPLICATION }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          MAIN_VITE_GA_API_SECRET: ${{ secrets.MAIN_VITE_GA_API_SECRET }}

      - name: Make (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: pnpm build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify packaged runtime dependencies
        if: github.event.inputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archives=()
          while IFS= read -r -d '' archive; do
            archives+=("$archive")
          done < <(find dist -type f -path '*/Contents/Resources/app.asar' -print0)
          test "${#archives[@]}" -gt 0
          node scripts/check-packaged-deps.cjs "${archives[@]}"

      - name: Generate changelog
        id: changelog
        uses: mathieudutour/github-tag-action@v6.2
        with:
          custom_tag: ${{ steps.version.outputs.new_tag }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: 'true'

      - name: Push changes and tags
        if: github.event.inputs.dry_run != 'true'
        run: |
          git push

      - name: Create a GitHub release
        if: github.event.inputs.dry_run != 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.new_tag }}
          name: Release v${{ steps.version.outputs.new_tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          artifacts: 'dist/*.zip,dist/latest-mac.yml'
          draft: ${{ github.event.inputs.draft }}

  signed_update_test:
    if: github.event.inputs.signed_update_test == 'true' && github.ref == 'refs/heads/test/signed-updater'
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Enable pnpm
        run: corepack enable pnpm

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          check-latest: true
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import signing certificate
        run: |
          chmod +x add-osx-cert.sh
          ./add-osx-cert.sh
        env:
          CERTIFICATE_OSX_APPLICATION: ${{ secrets.CERTIFICATE_OSX_APPLICATION }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Build app code
        run: pnpm build

      - name: Build signed baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          for version in 99.0.0 99.0.1; do
            pnpm exec electron-builder --mac --arm64 --publish never \
              --config electron-builder.update-test.yml \
              --config.extraMetadata.version="$version" \
              --config.directories.output="dist/update-test-$version"
          done
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify signed apps and update feed
        shell: bash
        run: |
          set -euo pipefail
          for version in 99.0.0 99.0.1; do
            output="dist/update-test-$version"
            app="$output/mac-arm64/Devkitty Update Test.app"
            test -d "$app"
            node scripts/check-packaged-deps.cjs "$app/Contents/Resources/app.asar"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose "$app"
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = 'app.devkitty.update-test'
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleName' "$app/Contents/Info.plist")" = 'Devkitty Update Test'
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
            node -e 'const asar = require("@electron/asar"); const metadata = JSON.parse(asar.extractFile(process.argv[1], "package.json")); if (metadata.name !== "devkitty-update-test" || metadata.productName !== "Devkitty Update Test" || metadata.version !== process.argv[2]) { console.error("Wrong packaged app identity", metadata.name, metadata.productName, metadata.version); process.exit(1); }' "$app/Contents/Resources/app.asar" "$version"
            ruby -ryaml -e 'feed = YAML.load_file(ARGV.fetch(0)); abort "Wrong update feed" unless feed["provider"] == "generic" && feed["url"] == "http://127.0.0.1:8765/" && feed["updaterCacheDirName"] == "devkitty-update-test-updater"' "$app/Contents/Resources/app-update.yml"
            test "$(find "$output" -maxdepth 1 -name '*.zip' -type f | wc -l | tr -d ' ')" = 1
          done
          ruby -ryaml -rdigest <<'RUBY'
          dir = 'dist/update-test-99.0.1'
          info = YAML.load_file(File.join(dir, 'latest-mac.yml'))
          abort 'Wrong candidate feed' unless info['version'] == '99.0.1' && info['files'].is_a?(Array) && info['files'].length == 1
          zip = info['files'][0]['url']
          abort 'Wrong candidate ZIP' unless zip.is_a?(String) && zip.end_with?('.zip') && zip.include?('99.0.1') && info['path'] == zip
          checksum = Digest::SHA512.file(File.join(dir, zip)).base64digest
          abort 'Wrong candidate checksum' unless info['files'][0]['sha512'] == checksum && info['sha512'] == checksum
          RUBY

      - uses: actions/upload-artifact@v4
        with:
          name: devkitty-update-test-baseline
          path: dist/update-test-99.0.0/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: devkitty-update-test-candidate
          path: |
            dist/update-test-99.0.1/*.zip
            dist/update-test-99.0.1/latest-mac.yml
          if-no-files-found: error
